# Builds the settlement program verifiably and publishes the binary and its hash.
#
# `anchor build --verifiable` compiles inside Anchor's pinned Docker image, so
# the same source gives the same bytes on any machine. That is what lets anyone
# check a deployed program against this repository: the "executable hash" below
# is sha256 over the binary with its trailing zero bytes removed, which is what
# the program's on-chain data hashes to once its own trailing padding is taken
# off (the same figure `solana-verify get-program-hash` reports).
#
# Runs on every push to main that touches the program, and on demand. A tag
# named program-v* also attaches the binary and hashes to a GitHub Release, so
# a mainnet deploy can point at a permanent record of exactly what it shipped.
#
# The program ID is compiled in (declare_id!), so this builds whatever ID the
# commit declares: devnet's today. See docs/rehearsal.md.
name: verifiable program build

on:
  push:
    branches: [main]
    paths: ["chain/**", ".github/workflows/verifiable-build.yml"]
    tags: ["program-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verifiable-build-${{ github.ref }}
  cancel-in-progress: false

env:
  ANCHOR_VERSION: "0.32.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Anchor CLI
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      - name: Install the Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libssl-dev
          cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Build verifiably
        working-directory: chain
        run: anchor build --verifiable

      - name: Hash
        id: hash
        run: |
          SO=chain/target/verifiable/oxude_settlement.so
          test -f "$SO"
          SIZE=$(stat -c%s "$SO")
          FILE_SHA=$(sha256sum "$SO" | cut -d' ' -f1)
          EXEC_SHA=$(python3 -c "import hashlib,sys; d=open(sys.argv[1],'rb').read().rstrip(b'\0'); print(hashlib.sha256(d).hexdigest())" "$SO")
          PROGRAM_ID=$(grep -o 'declare_id!("[^"]*")' chain/programs/oxude_settlement/src/lib.rs | sed 's/declare_id!("//; s/")//')
          mkdir -p out
          cp "$SO" out/oxude_settlement.so
          cat > out/oxude_settlement.sha256.txt <<EOF
          commit           ${GITHUB_SHA}
          program id       ${PROGRAM_ID}
          anchor           ${ANCHOR_VERSION} (--verifiable)
          size             ${SIZE} bytes
          sha256 (file)    ${FILE_SHA}
          executable hash  ${EXEC_SHA}
          EOF
          sed -i 's/^ *//' out/oxude_settlement.sha256.txt
          {
            echo "### Verifiable build of \`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            cat out/oxude_settlement.sha256.txt
            echo '```'
            echo
            echo "Check a deployed program: \`solana-verify get-program-hash <PROGRAM_ID>\` should print the executable hash."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: oxude_settlement-${{ github.sha }}
          path: out/
          retention-days: 90

      - name: Attach to a release
        if: startsWith(github.ref, 'refs/tags/program-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/oxude_settlement.so out/oxude_settlement.sha256.txt \
            --title "${GITHUB_REF_NAME}" --notes-file out/oxude_settlement.sha256.txt --verify-tag
